<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #0f172a;
    font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
    color: #e2e8f0;
    overflow: hidden;
    user-select: none;
  }
  .wrap {
    display: flex; flex-direction: column; height: 100%; padding: 16px; gap: 8px;
  }
  .input-row {
    display: flex; gap: 8px; position: relative;
  }
  .input-row input {
    flex: 1; padding: 10px 14px;
    border: 1px solid #334155; border-radius: 8px;
    background: #1e293b; color: #e2e8f0; font-size: 14px;
    outline: none; transition: border 0.2s;
  }
  .input-row input:focus { border-color: #6366f1; }
  .input-row button {
    padding: 10px 20px;
    border: none; border-radius: 8px;
    background: #6366f1; color: #fff; font-size: 14px; font-weight: 600;
    cursor: pointer; transition: background 0.15s;
  }
  .input-row button:hover { background: #4f46e5; }
  .input-row button:disabled { background: #334155; cursor: not-allowed; }

  .history-drop {
    display: none; position: absolute;
    top: 100%; left: 0; right: 0;
    background: #1e293b; border: 1px solid #334155; border-radius: 8px;
    margin-top: 4px; max-height: 200px; overflow-y: auto; z-index: 10;
  }
  .history-drop.show { display: block; }
  .history-drop .hdr {
    font-size: 10px; color: #64748b; padding: 6px 12px;
    border-bottom: 1px solid #334155;
    display: flex; justify-content: space-between;
  }
  .history-drop .hdr .clr { cursor: pointer; color: #94a3b8; }
  .history-drop .hdr .clr:hover { color: #f87171; }
  .history-drop .item {
    padding: 8px 12px; font-size: 13px; cursor: pointer;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    border-bottom: 1px solid #1e293b;
  }
  .history-drop .item:hover { background: #334155; }
  .history-drop .item:last-child { border-bottom: none; }

  .result {
    flex: 1; overflow-y: auto;
    background: #1e293b; border-radius: 8px; padding: 14px;
    font-size: 13px; line-height: 1.7; white-space: pre-wrap; word-break: break-word;
  }
  .result.loading { color: #94a3b8; display: flex; align-items: center; justify-content: center; }
  .result.error { color: #f87171; }
  .result:empty::after { content: '输入问题，按 Enter 发送'; color: #475569; }
  .hint { font-size: 11px; color: #64748b; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <div class="input-row" id="input-row">
    <input id="input" type="text" placeholder="问点什么..." autofocus autocomplete="off">
    <button id="btn">发送</button>
    <div class="history-drop" id="hist-drop">
      <div class="hdr"><span>最近提问</span><span class="clr" id="hist-clear">清除</span></div>
    </div>
  </div>
  <div class="result" id="result"></div>
  <div class="hint">Enter 发送 · Escape 关闭 · ↓ 历史</div>
</div>
<script>
  const input = document.getElementById('input');
  const btn = document.getElementById('btn');
  const result = document.getElementById('result');
  const histDrop = document.getElementById('hist-drop');
  let loading = false;

  let history = [];
  const HIST_KEY = 'jellyfish-quick-ask-history';
  try {
    history = JSON.parse(localStorage.getItem(HIST_KEY) || '[]');
  } catch (e) { history = []; }

  function saveHistory() {
    localStorage.setItem(HIST_KEY, JSON.stringify(history));
  }

  function addHistory(text) {
    history = history.filter(h => h !== text);
    history.unshift(text);
    if (history.length > 10) history = history.slice(0, 10);
    saveHistory();
    renderHistory();
  }

  function renderHistory() {
    histDrop.querySelectorAll('.item').forEach(el => el.remove());
    if (history.length === 0) {
      histDrop.classList.remove('show');
      return;
    }
    history.forEach(h => {
      const div = document.createElement('div');
      div.className = 'item';
      div.textContent = h;
      div.addEventListener('click', () => {
        input.value = h;
        histDrop.classList.remove('show');
        submit();
      });
      histDrop.appendChild(div);
    });
  }

  document.getElementById('hist-clear').addEventListener('click', (e) => {
    e.stopPropagation();
    history = [];
    saveHistory();
    histDrop.classList.remove('show');
  });

  input.addEventListener('focus', () => {
    if (history.length > 0) { renderHistory(); histDrop.classList.add('show'); }
  });
  input.addEventListener('blur', () => {
    setTimeout(() => histDrop.classList.remove('show'), 200);
  });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown' && histDrop.classList.contains('show')) {
      e.preventDefault();
      const first = histDrop.querySelector('.item');
      if (first) { input.value = first.textContent; histDrop.classList.remove('show'); }
    }
  });

  async function submit(text) {
    const q = text || input.value.trim();
    if (!q || loading) return;
    loading = true;
    btn.disabled = true;
    result.textContent = '';
    result.className = 'result loading';
    result.textContent = '思考中...';

    addHistory(q);

    try {
      const resp = await window.quickAskAPI.submit(q);
      if (resp.ok) {
        result.className = 'result';
        result.textContent = resp.text;
      } else {
        result.className = 'result error';
        result.textContent = 'Error: ' + resp.error;
      }
    } catch (e) {
      result.className = 'result error';
      result.textContent = '连接失败: ' + e.message;
    } finally {
      loading = false;
      btn.disabled = false;
    }
  }

  btn.addEventListener('click', () => submit());
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); submit(); }
    if (e.key === 'Escape') window.quickAskAPI.close();
  });

  renderHistory();
</script>
</body>
</html>
